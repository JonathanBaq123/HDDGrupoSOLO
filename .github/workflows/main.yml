name: HDDGrupoSOLO

on:
  push:
    branches:
      - main

env:
  GRUPO: "HDDGrupoSOLO"
  CURSO: "Herramientas de Desarrollo"
  MOSTRAR_DESPEDIDA: "true"

jobs:
  ejecucion:
    runs-on: ubuntu-latest
    steps:
      - name: Prueba de mensajes
        run: |
          echo "Hola equipo de $GRUPO, saludo desde GitHub Actions"


      - name: Variables creada en el workflow
        run: |
          echo "Variable 1 (GRUPO): $GRUPO"
          echo "Variable 2 (CURSO): $CURSO"
          echo "Variable 3 (MOSTRAR_DESPEDIDA): $MOSTRAR_DESPEDIDA"


      - name: Variables del entorno del Github Actions
        run: |
         echo "Nombre del repositorio: ${{ github.repository }}"
         echo "Dueno del repositorio: ${{ github.repository_owner }}"
         echo "Rama principal: ${{ github.ref_name }}"


      - name: Con Despedida
        if: env.MOSTRAR_DESPEDIDA == 'true'
        run: |
          echo "Hasta pronto equipo de $GRUPO!"

      - name: Sin despedida
        if: env.MOSTRAR_DESPEDIDA == 'false'
        run: |
          echo "Esto no deberia imprimirse"

      - name: Generar y mostrar resultado en JSON
        run: |
          printf '{\n  "grupo": "%s",\n  "curso": "%s",\n  "mostrar_despedida": "%s",\n  "repositorio": "%s",\n  "dueno": "%s",\n  "rama": "%s"\n}\n' "$GRUPO" "$CURSO" "$MOSTRAR_DESPEDIDA" "${{ github.repository }}" "${{ github.repository_owner }}" "${{ github.ref_name }}" > resultado.json
          cat resultado.json
